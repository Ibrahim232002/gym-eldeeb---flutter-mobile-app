name: gym_eldeeb
description: "Gym ElDeeb - Production Arabic-first Gym Management Flutter App with Supabase and Offline-First Architecture"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase Client SDK
  supabase_flutter: ^2.8.0
  uuid: ^4.5.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Declarative Routing
  go_router: ^14.8.1

  # Local Persistence & Offline-First Caching
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4

  # Network & Connectivity Detection
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.0


  # UI & Typography (Arabic Google Fonts & Localization)
  google_fonts: ^6.2.1
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
